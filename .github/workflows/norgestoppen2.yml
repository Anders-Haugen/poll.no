name: Oppdater Norgestoppen2

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'

permissions:
  contents: write

concurrency:
  group: norgestoppen2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/norgestoppen_requirements.txt
      - run: pip install -r tools/norgestoppen_requirements.txt
      - run: python tools/test_norgestoppen.py
      - run: python tools/sync_norgestoppen.py
      - name: Lagre resultat
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/norgestoppen2.json data/norgestoppen_archive.json
          if ! git diff --cached --quiet; then
            git commit -m 'Oppdater innendørsresultater for Norgestoppen2'
            git push
          fi