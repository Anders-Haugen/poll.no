<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Baner | Pøll.no</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col">
  <header class="bg-white shadow p-6">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-3xl font-bold">Admin - Baner</h1>
      <div class="flex gap-2">
        <button id="logoutBtn" class="px-4 py-2 bg-red-600 text-white rounded-full hover:bg-red-700 transition hidden">Logg ut</button>
        <a href="skytebanespelet.html" class="px-4 py-2 bg-blue-600 text-white rounded-full hover:bg-blue-700 transition">Til spelet</a>
      </div>
    </div>
  </header>

  <!-- Login skjerm -->
  <div id="loginSkjerm" class="flex-grow flex items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow p-8 w-full max-w-md">
      <h2 class="text-2xl font-bold mb-6">Admin Login</h2>
      <div class="mb-4">
        <label class="block text-sm font-semibold mb-2">Passord</label>
        <input id="passordInput" type="password" placeholder="Skriv passord" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-blue-600">
      </div>
      <button id="loginBtn" class="w-full px-4 py-3 bg-blue-600 text-white rounded-full font-semibold hover:bg-blue-700 transition">
        Logg inn
      </button>
      <p id="loginFeil" class="hidden text-sm text-red-600 mt-3 text-center"></p>
      <p class="text-xs text-gray-500 mt-4 text-center">Logg inn med passordet du satte for Supabase-brukeren.</p>
      <p class="text-xs text-gray-500 mt-1 text-center">Bruker: anderhau2@icloud.com</p>
    </div>
  </div>

  <!-- Admin panel -->
  <main id="adminPanel" class="hidden max-w-6xl mx-auto p-6 w-full flex-grow">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
      <!-- Legg til ny bane -->
      <div class="lg:col-span-2 bg-white rounded-2xl shadow p-6">
        <h2 class="text-2xl font-bold mb-6">Legg til ny bane</h2>
        <form id="baneForm" class="space-y-4">
          <input id="redigerId" type="hidden" />
          <div>
            <label class="block text-sm font-semibold mb-1">Banenavn</label>
            <input id="navn" type="text" placeholder="f.eks. Herre-NM Gål" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-1">Skytterlag</label>
            <input id="lag" type="text" placeholder="f.eks. Lillesand Skytelag" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-semibold mb-1">Breddegrad</label>
              <input id="lat" type="number" step="0.0001" placeholder="f.eks. 58.5" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
            </div>
            <div>
              <label class="block text-sm font-semibold mb-1">Lengdegrad</label>
              <input id="lng" type="number" step="0.0001" placeholder="f.eks. 8.5" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
            </div>
          </div>

          <div>
            <label class="block text-sm font-semibold mb-2">Tags (kommaseparert)</label>
            <input id="tags" type="text" placeholder="f.eks. LS-bane, 300m, sommerkamp" class="w-full px-4 py-2 border border-gray-300 rounded-lg" required>
            <p class="text-xs text-gray-500 mt-1">Eksempler: LS-bane, 300m, 25m, luftgevær, etc.</p>
          </div>

          <div class="flex gap-2">
            <button id="lagreBaneBtn" type="submit" class="w-full px-4 py-3 bg-green-600 text-white rounded-full font-semibold hover:bg-green-700 transition">
              Legg til bane
            </button>
            <button id="avbrytRedigerBtn" type="button" class="hidden px-4 py-3 bg-gray-500 text-white rounded-full font-semibold hover:bg-gray-600 transition">
              Avbryt
            </button>
          </div>
        </form>
      </div>

      <!-- Statistikk -->
      <div class="bg-white rounded-2xl shadow p-6">
        <h3 class="text-xl font-bold mb-4">Statistikk</h3>
        <div class="space-y-3">
          <div>
            <p class="text-sm text-gray-600">Totalt antall baner</p>
            <p id="totaltBaner" class="text-3xl font-bold text-blue-600">0</p>
          </div>
          <div>
            <p class="text-sm text-gray-600">Unike tags</p>
            <p id="unikkeTags" class="text-3xl font-bold text-green-600">0</p>
          </div>
        </div>

        <div class="mt-6 pt-6 border-t">
          <button id="eksportBtn" class="w-full px-4 py-2 bg-gray-600 text-white rounded-full text-sm font-semibold hover:bg-gray-700 transition mb-2">
            Eksporter data
          </button>
          <button id="importBtn" class="w-full px-4 py-2 bg-gray-600 text-white rounded-full text-sm font-semibold hover:bg-gray-700 transition">
            Importer data
          </button>
        </div>
      </div>
    </div>

    <!-- Baner liste -->
    <div class="bg-white rounded-2xl shadow p-6">
      <h2 class="text-2xl font-bold mb-4">Eksisterende baner</h2>
      <div id="banerListe" class="space-y-3">
        <!-- Fylt av JavaScript -->
      </div>
    </div>
  </main>

  <footer class="bg-white shadow mt-12 p-6 text-center text-sm">
    <p class="text-gray-500">&copy; 2026 Pøll.no | Admin Panel</p>
  </footer>

  <script>
    const SUPABASE_URL = 'https://zatxxqyqgcismveykpbo.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InphdHh4cXlxZ2Npc212ZXlrcGJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDQ1OTksImV4cCI6MjA5NDg4MDU5OX0.DEfL_aTqQ2BG047c-EtaxUcicyjJloiNPCyBbiqsPYs';
    const ADMIN_EMAIL = 'anderhau2@icloud.com';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function visLoginFeil(melding) {
      const feilfelt = document.getElementById('loginFeil');
      feilfelt.textContent = melding;
      feilfelt.classList.remove('hidden');
    }

    function skjulLoginFeil() {
      const feilfelt = document.getElementById('loginFeil');
      feilfelt.textContent = '';
      feilfelt.classList.add('hidden');
    }

    function formatLoginFeil(error) {
      const melding = (error?.message || '').toLowerCase();

      if (!melding) {
        return 'Innlogging feilet. Prøv igjen.';
      }

      if (melding.includes('invalid login credentials')) {
        return 'Feil passord for admin-brukeren, eller brukeren finnes ikke i Supabase.';
      }

      if (melding.includes('email not confirmed')) {
        return 'Supabase-brukeren må bekrefte e-postadressen før innlogging virker.';
      }

      if (melding.includes('fetch') || melding.includes('network')) {
        return 'Klarte ikke å kontakte Supabase. Sjekk nettverk, domene og at prosjektet er oppe.';
      }

      return error.message;
    }

    // ===== LOGIN SYSTEM =====
    async function erLoggetInn() {
      const { data, error } = await supabaseClient.auth.getSession();
      if (error) {
        return false;
      }
      return !!data.session;
    }

    async function loggInn() {
      const passord = document.getElementById('passordInput').value.trim();
      const loginBtn = document.getElementById('loginBtn');

      skjulLoginFeil();

      if (!passord) {
        visLoginFeil('Skriv inn passordet først.');
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Logger inn...';

      const { error } = await supabaseClient.auth.signInWithPassword({
        email: ADMIN_EMAIL,
        password: passord
      });

      loginBtn.disabled = false;
      loginBtn.textContent = 'Logg inn';

      if (error) {
        document.getElementById('passordInput').value = '';
        visLoginFeil(formatLoginFeil(error));
        return;
      }

      skjulLoginFeil();
      document.getElementById('passordInput').value = '';
      await visPanelet();
    }

    async function loggUt() {
      await supabaseClient.auth.signOut();
      document.getElementById('passordInput').value = '';
      await visPanelet();
    }

    async function visPanelet() {
      const loggetInn = await erLoggetInn();
      document.getElementById('loginSkjerm').classList.toggle('hidden', loggetInn);
      document.getElementById('adminPanel').classList.toggle('hidden', !loggetInn);
      document.getElementById('logoutBtn').classList.toggle('hidden', !loggetInn);

      if (loggetInn) {
        await oppdaterBaneListe();
        await oppdaterStatistikk();
      }
    }

    // ===== DATA MANAGEMENT =====
    class BaneData {
      static async getBaner() {
        const { data, error } = await supabaseClient
          .from('baner')
          .select('id, navn, lag, lat, lng, tags, created_at')
          .order('created_at', { ascending: false });

        if (error) {
          throw error;
        }

        return data.map((bane) => ({
          ...bane,
          tags: Array.isArray(bane.tags) ? bane.tags : []
        }));
      }

      static async leggTilBane(bane) {
        const { error } = await supabaseClient.from('baner').insert([{
          navn: bane.navn,
          lag: bane.lag,
          lat: bane.lat,
          lng: bane.lng,
          tags: bane.tags
        }]);

        if (error) {
          throw error;
        }
      }

      static async slettBane(id) {
        const { error } = await supabaseClient.from('baner').delete().eq('id', id);
        if (error) {
          throw error;
        }
      }

      static async oppdaterBane(oppdatertBane) {
        const { error } = await supabaseClient
          .from('baner')
          .update({
            navn: oppdatertBane.navn,
            lag: oppdatertBane.lag,
            lat: oppdatertBane.lat,
            lng: oppdatertBane.lng,
            tags: oppdatertBane.tags
          })
          .eq('id', oppdatertBane.id);

        if (error) {
          throw error;
        }
      }

      static async getTags() {
        const baner = await this.getBaner();
        const tags = new Set();
        baner.forEach(b => {
          b.tags.forEach(t => tags.add(t.trim()));
        });
        return Array.from(tags).sort();
      }
    }

    // ===== FORM HANDLING =====
    document.getElementById('baneForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const redigerId = document.getElementById('redigerId').value;
      const navn = document.getElementById('navn').value;
      const lag = document.getElementById('lag').value;
      const lat = parseFloat(document.getElementById('lat').value);
      const lng = parseFloat(document.getElementById('lng').value);
      const tagsString = document.getElementById('tags').value;
      const tags = tagsString.split(',').map(t => t.trim()).filter(t => t);

      if (!navn || !lag || !lat || !lng || tags.length === 0) {
        alert('Fyll ut alle felt');
        return;
      }

      if (lat < 57 || lat > 71 || lng < 4 || lng > 31) {
        alert('Koordinater er utenfor Norge');
        return;
      }

      const bane = { navn, lag, lat, lng, tags };

      try {
        if (redigerId) {
          bane.id = redigerId;
          await BaneData.oppdaterBane(bane);
          alert('Bane oppdatert!');
        } else {
          await BaneData.leggTilBane(bane);
          alert('Bane lagt til!');
        }

        resetBaneForm();
        await oppdaterBaneListe();
        await oppdaterStatistikk();
      } catch (err) {
        alert('Kunne ikke lagre bane: ' + err.message);
      }
    });

    // ===== LISTE OPPDATERING =====
    async function oppdaterBaneListe() {
      let baner = [];
      try {
        baner = await BaneData.getBaner();
      } catch (err) {
        document.getElementById('banerListe').innerHTML = '<p class="text-red-600">Feil ved lasting av baner.</p>';
        return;
      }

      const liste = document.getElementById('banerListe');

      if (baner.length === 0) {
        liste.innerHTML = '<p class="text-gray-500">Ingen baner lagt inn ennå</p>';
        return;
      }

      liste.innerHTML = baner.map(bane => `
        <div class="border border-gray-200 rounded-lg p-4 bg-gray-50 flex justify-between items-start">
          <div class="flex-grow">
            <h3 class="font-bold text-lg">${bane.navn}</h3>
            <p class="text-sm text-gray-600">Lag: ${bane.lag}</p>
            <p class="text-sm text-gray-600">Koordinater: ${bane.lat.toFixed(4)}, ${bane.lng.toFixed(4)}</p>
            <div class="mt-2 flex flex-wrap gap-1">
              ${bane.tags.map(tag => `<span class="inline-block px-2 py-1 bg-blue-200 text-blue-800 text-xs rounded">${tag}</span>`).join('')}
            </div>
          </div>
          <div class="ml-4 flex gap-2">
            <button onclick="startRedigerBane(${bane.id})" class="px-3 py-1 bg-blue-600 text-white rounded text-sm hover:bg-blue-700 transition">
              Rediger
            </button>
            <button onclick="slettBane(${bane.id})" class="px-3 py-1 bg-red-600 text-white rounded text-sm hover:bg-red-700 transition">
              Slett
            </button>
          </div>
        </div>
      `).join('');
    }

    async function startRedigerBane(id) {
      const baner = await BaneData.getBaner();
      const bane = baner.find(b => b.id === id);
      if (!bane) {
        return;
      }

      document.getElementById('redigerId').value = bane.id;
      document.getElementById('navn').value = bane.navn;
      document.getElementById('lag').value = bane.lag;
      document.getElementById('lat').value = bane.lat;
      document.getElementById('lng').value = bane.lng;
      document.getElementById('tags').value = bane.tags.join(', ');
      document.getElementById('lagreBaneBtn').textContent = 'Lagre endringer';
      document.getElementById('lagreBaneBtn').classList.remove('bg-green-600', 'hover:bg-green-700');
      document.getElementById('lagreBaneBtn').classList.add('bg-blue-600', 'hover:bg-blue-700');
      document.getElementById('avbrytRedigerBtn').classList.remove('hidden');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function resetBaneForm() {
      document.getElementById('baneForm').reset();
      document.getElementById('redigerId').value = '';
      document.getElementById('lagreBaneBtn').textContent = 'Legg til bane';
      document.getElementById('lagreBaneBtn').classList.remove('bg-blue-600', 'hover:bg-blue-700');
      document.getElementById('lagreBaneBtn').classList.add('bg-green-600', 'hover:bg-green-700');
      document.getElementById('avbrytRedigerBtn').classList.add('hidden');
    }

    async function slettBane(id) {
      if (confirm('Sikker på at du vil slette denne banen?')) {
        try {
          await BaneData.slettBane(id);
          await oppdaterBaneListe();
          await oppdaterStatistikk();
        } catch (err) {
          alert('Kunne ikke slette bane: ' + err.message);
        }
      }
    }

    async function oppdaterStatistikk() {
      const baner = await BaneData.getBaner();
      const tags = await BaneData.getTags();

      document.getElementById('totaltBaner').textContent = baner.length;
      document.getElementById('unikkeTags').textContent = tags.length;
    }

    // ===== EKSPORT/IMPORT =====
    document.getElementById('eksportBtn').addEventListener('click', async () => {
      const baner = await BaneData.getBaner();
      const data = JSON.stringify(baner, null, 2);
      const blob = new Blob([data], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'baner-' + new Date().toISOString().split('T')[0] + '.json';
      a.click();
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = '.json';
      input.onchange = (e) => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = async (event) => {
          try {
            const baner = JSON.parse(event.target.result);
            if (!Array.isArray(baner)) {
              throw new Error('JSON må være en liste av baner');
            }

            const payload = baner.map((bane) => ({
              navn: bane.navn,
              lag: bane.lag,
              lat: bane.lat,
              lng: bane.lng,
              tags: Array.isArray(bane.tags) ? bane.tags : []
            }));

            const { error } = await supabaseClient.from('baner').insert(payload);
            if (error) {
              throw error;
            }

            alert('Data importert!');
            await oppdaterBaneListe();
            await oppdaterStatistikk();
          } catch (err) {
            alert('Feil ved import: ' + err.message);
          }
        };
        reader.readAsText(file);
      };
      input.click();
    });

    // ===== EVENT LISTENERS =====
    document.getElementById('loginBtn').addEventListener('click', () => {
      loggInn();
    });
    document.getElementById('logoutBtn').addEventListener('click', () => {
      loggUt();
    });
    document.getElementById('avbrytRedigerBtn').addEventListener('click', resetBaneForm);
    document.getElementById('passordInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') loggInn();
    });
    document.getElementById('passordInput').addEventListener('input', skjulLoginFeil);

    // ===== INIT =====
    window.addEventListener('load', async () => {
      await visPanelet();
    });
  </script>
</body>
</html>
