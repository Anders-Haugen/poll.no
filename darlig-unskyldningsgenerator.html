<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Unskyldningsgeneratoren – Pøll.no</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .generator-boks {
      border: 1px solid #e0e0e0;
      padding: 1.8rem 2rem;
      margin: 1.5rem 0;
      min-height: 4rem;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    .generator-status {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 1.2rem;
    }
    .generator-knapp {
      font-family: 'Montserrat', Arial, sans-serif;
      font-weight: 900;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      background: #222;
      color: #fff;
      border: none;
      padding: 0.8rem 1.6rem;
      cursor: pointer;
    }
    .generator-knapp:hover { background: #444; }
    .generator-knapp:disabled { background: #ccc; cursor: default; }
  </style>
</head>
<body>

  <header>
    <h1>Pøll.no</h1>
    <p>Anders Haugen — skytesport, 3D-print og diverse tull</p>
  </header>

  <nav>
    <a href="index.html">Framsida</a>
    <a href="3d-dingser.html">3D-dingser</a>
    <a href="skyteteori.html">Skyteteori</a>
    <a href="darlig-unskyldningsgenerator.html" class="aktiv">Unskyldningsgeneratoren</a>
  </nav>

  <main>
    <article>
      <h1>Dårleg unskyldningsgenerator</h1>
      <p class="ingress">For når resultatlista ikkje er til å vise til nokon.</p>

      <div class="generator-boks">
        <span id="excuse-text">Trykk på knappen.</span>
      </div>

      <p class="generator-status" id="status">Lastar unskyldningar...</p>

      <button
        id="new-excuse-btn"
        type="button"
        disabled
        class="generator-knapp"
      >Ny unskyldning</button>
    </article>
  </main>

  <footer>
    &copy; 2026 Anders Haugen · Pøll.no
  </footer>

  <script>
    const statusEl = document.getElementById('status');
    const excuseTextEl = document.getElementById('excuse-text');
    const buttonEl = document.getElementById('new-excuse-btn');

    let excuses = [];

    function pickRandomExcuse() {
      if (!excuses.length) {
        excuseTextEl.textContent = 'Fant ingen unskyldninger i fila.';
        return;
      }

      const randomIndex = Math.floor(Math.random() * excuses.length);
      excuseTextEl.textContent = excuses[randomIndex];
    }

    async function fetchExcusesFromFile() {
      const candidatePaths = [
        'data/unskyldninger.json',
        './data/unskyldninger.json',
        '/data/unskyldninger.json'
      ];

      for (const path of candidatePaths) {
        try {
          const response = await fetch(path, { cache: 'no-store' });
          if (!response.ok) {
            continue;
          }

          const data = await response.json();
          if (Array.isArray(data)) {
            return data;
          }
          if (Array.isArray(data.unskyldninger)) {
            return data.unskyldninger;
          }
        } catch (error) {
          // Try next path candidate.
        }
      }

      throw new Error('Klarte ikke å finne gyldig datafil for unskyldninger.');
    }

    async function loadExcuses() {
      if (window.location.protocol === 'file:') {
        statusEl.textContent = 'Denne sida må åpnes via en webserver, ikke direkte som fil.';
        excuseTextEl.textContent = 'Start lokal server og åpne siden via http://...';
        return;
      }

      try {
        excuses = await fetchExcusesFromFile();
        if (!excuses.length) {
          throw new Error('Datafilen ble lest, men inneholdt ingen unskyldninger.');
        }

        statusEl.textContent = `Lastet ${excuses.length} unskyldninger.`;
        buttonEl.disabled = false;
        pickRandomExcuse();
      } catch (error) {
        statusEl.textContent = 'Klarte ikke å laste unskyldninger fra datafil.';
        excuseTextEl.textContent = 'Sjekk data/unskyldninger.json og at siden kjøres via webserver.';
      }
    }

    buttonEl.addEventListener('click', pickRandomExcuse);
    loadExcuses();
  </script>

</body>
</html>
