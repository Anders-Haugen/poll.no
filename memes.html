<!DOCTYPE html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Memes – Pøll.no</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .meme-intro {
      color: #777;
      font-size: 0.9rem;
      margin: -0.4rem 0 1.8rem;
    }

    .meme-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1.2rem;
    }

    .meme {
      min-width: 0;
      overflow: hidden;
      border: 1px solid #deded9;
      background: #fff;
    }

    .meme-image {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      object-fit: contain;
      background: #f5f5f2;
    }

    .meme .caption {
      padding: 0.9rem 1rem 1rem;
      font-size: 0.78rem;
      color: #666;
    }

  </style>
</head>
<body>
  <header>
    <h1>Pøll.no</h1>
    <p>Anders Haugen — diverse innan DFS-skyting</p>
  </header>

  <nav>
    <a href="index.html">Framsida</a>
    <a href="3d-dingser.html">3D-dingser</a>
    <a href="skyteteori.html">Skyteteori</a>
    <a href="darlig-unnskyldningsgenerator.html">Unnskyldningsgeneratoren</a>
    <a href="memes.html" class="aktiv">Memes</a>
  </nav>

  <main>
    <article>
      <h1>DFS-memes</h1>
      <p class="ingress">Forsøk på treffsikker humor.</p>

      <div class="meme-grid" id="meme-grid" aria-live="polite">
        <p class="meme-intro">Lastar memes ...</p>
      </div>
    </article>
  </main>

  <footer>
    &copy; 2026 Anders Haugen &middot; Pøll.no
  </footer>

  <script>
    const memeGridEl = document.getElementById("meme-grid");
    const imageExtensions = [".jpg", ".jpeg", ".png", ".webp", ".gif"];

    function hasImageExtension(fileName) {
      const lowerName = fileName.toLowerCase();
      return imageExtensions.some((extension) => lowerName.endsWith(extension));
    }

    function displayName(fileName) {
      return fileName
        .replace(/\.[^.]+$/, "")
        .replace(/[_-]+/g, " ");
    }

    async function loadMemes() {
      try {
        const response = await fetch("data/memes/index.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error("Klarte ikkje laste meme-lista.");
        }

        const manifest = await response.json();
        const files = (Array.isArray(manifest.images) ? manifest.images : [])
          .filter((fileName) => typeof fileName === "string")
          .filter((fileName) => !fileName.includes("/") && !fileName.includes("\\") && hasImageExtension(fileName))
          .sort((first, second) => first.localeCompare(second, "no"));

        memeGridEl.innerHTML = "";
        if (files.length === 0) {
          memeGridEl.innerHTML = '<p class="meme-intro">Ingen memes funne enno.</p>';
          return;
        }

        files.forEach((fileName) => {
          const card = document.createElement("section");
          card.className = "meme";
          const image = document.createElement("img");
          image.className = "meme-image";
          image.src = `data/memes/${encodeURIComponent(fileName)}`;
          image.alt = displayName(fileName);
          image.loading = "lazy";
          card.appendChild(image);
          memeGridEl.appendChild(card);
        });
      } catch (error) {
        const message = window.location.protocol === "file:"
          ? "Opne sida via lokal server for å laste meme-lista."
          : `${error.message} Kontroller at data/memes/index.json og bildefilene er publiserte.`;
        memeGridEl.innerHTML = `<p class="meme-intro">${message}</p>`;
      }
    }

    loadMemes();
  </script>
</body>
</html>
